# EC2 host nginx site for carconnect.shivanshu.website
# Copy to /etc/nginx/sites-available/carconnect, symlink into sites-enabled.
# (certbot --nginx will insert the HTTPS/443 block automatically.)

server {
    listen 80;
    server_name carconnect.shivanshu.website;

    root /var/www/carconnect;
    index index.html;

    client_max_body_size 50m;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to the Dockerized backend (bound to host loopback)
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache hashed static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}