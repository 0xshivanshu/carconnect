services:
  backend:
    build: ./backend
    container_name: carconnect-backend
    restart: unless-stopped
    # Bound to loopback only — EC2 host nginx proxies /api to it.
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}